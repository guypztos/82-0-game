<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}82-0{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/"><span class="led">{% block logo %}82-0{% endblock %}</span></a>
    {% if game is defined and game %}
      <span class="mode-badge">{{ game.mode.value | capitalize }} mode</span>
    {% endif %}
  </header>
  <main>
    {% if error %}
      <p class="banner" role="alert">{{ error }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">{% block credit %}{{ credit }}{% endblock %}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
